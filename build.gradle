plugins {
    // 1.21.11 is still an obfuscated Minecraft release, so the build needs the
    // remapping Loom plugin. The plain `net.fabricmc.fabric-loom` id that `main`
    // uses is the non-remapping variant for 26.1+, where Mojang ships
    // deobfuscated jars and there is nothing to remap.
    id 'net.fabricmc.fabric-loom-remap' version '1.17.19'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom adds the Fabric and Mojang repositories automatically.
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Obfuscated release, so the mapping set has to be requested explicitly -
    // unlike 26.1+, where `main` has no `mappings` line at all. The mod is
    // written against official (Mojang) names, not Yarn.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu is an optional integration: we compile against it so the
    // settings panel can be opened from Mod Menu, but it is never bundled
    // and the mod runs fine without it installed.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
