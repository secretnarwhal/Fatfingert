# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 1.21.1 runs on Java 21, so point Gradle's toolchain resolver at a
# JDK 21 install. Override this per machine; the foojay resolver in
# settings.gradle will download one if the path is absent.
#org.gradle.java.installations.paths=C:/Users/Ryan/tools/jdk-21

# Minecraft / Fabric versions (for Minecraft 1.21.1)
minecraft_version=1.21.1
loader_version=0.16.14
fabric_version=0.116.15+1.21.1

# Optional integrations
modmenu_version=11.0.4

# Mod properties
mod_version=3.0.0
maven_group=dev.fatfingert
archives_base_name=fatfingert
