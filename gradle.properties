# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 1.21.11 runs on Java 21, so point Gradle's toolchain resolver at a
# JDK 21 install. Override this per machine; the foojay resolver in
# settings.gradle will download one if the path is absent.
#org.gradle.java.installations.paths=C:/Users/Ryan/tools/jdk-21

# Minecraft / Fabric versions (for Minecraft 1.21.11)
minecraft_version=1.21.11
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

# Optional integrations
modmenu_version=17.0.0

# Mod properties
mod_version=3.0.0
maven_group=dev.fatfingert
archives_base_name=fatfingert
